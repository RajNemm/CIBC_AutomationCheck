# Replace with a JDBC URL and a read-only SELECT returning the columns under test.
secupi.jdbc.url=jdbc:oracle:thin:@//dbhost:1521/service
secupi.query=SELECT CUSTOMER_ID, CUSTOMER_NAME, ACCOUNT_NUMBER FROM SECUPI_TEST_DATA ORDER BY CUSTOMER_ID

# Regex for a fully masked value; replace with the format used by your policy.
secupi.masked.value.regex=^X+$

# List column names only. The test checks these classifications for every returned row.
secupi.expected.regular.clear.columns=CUSTOMER_ID,CUSTOMER_NAME
secupi.expected.regular.masked.columns=ACCOUNT_NUMBER

secupi.expected.privileged.clear.columns=CUSTOMER_ID,CUSTOMER_NAME,ACCOUNT_NUMBER
secupi.expected.privileged.masked.columns=
